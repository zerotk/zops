files: ^src/zz
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace

  - repo: local
    hooks:
    - id: black
      name: black
      entry: uv run black
      language: system
      types: [python]

    - id: flake8
      name: flake8
      entry: uv run flake8
      language: system
      types: [python]
      args:
        - "--ignore=C901,W503,E501"

    - id: isort
      name: isort
      entry: uv run isort
      language: system
      types: [python]
