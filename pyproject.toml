[project]
name = "zerotk.zops"
version = "2.0.0"
description = "Zero Operations Toolbox"
authors = [
    { name = "Alexandre Andrade", email = "kaniabi@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
dependencies = [
    "click>=8.1.7",
    "attrs>=23.2.0",
    "boto3>=1.34.106",
    "tabulate>=0.9.0",
    "pyyaml>=6.0.1",
    "addict>=2.4.0",
    "jinja2>=3.1.4",
    "stringcase>=1.2.0",
    "ruamel-yaml>=0.18.6",
    "str2bool>=1.1",
    "rich>=13.7.1",
]

[project.urls]
Homepage = "https://github.com/zerotk/zops"
Repository = "https://github.com/zerotk/zops"
Documentation = "https://github.com/zerotk/zops"

[project.scripts]
zops = "zops.__main__:main"
zz = "zz.__main__:main"

[dependency-groups]
dev = [
    "black>=24.4.2",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "pytest>=8.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerotk", "src/zops", "src/zz"]

[tool.isort]
profile = "black"
force_single_line = true
lines_after_imports = 2
